<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Showing Your Hand</title>
<style>
:root{color-scheme:dark;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111512;color:#f0efe5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0,#2a3428 0,transparent 65%)}main{width:min(680px,100%);padding:48px 28px}header{display:flex;align-items:center;gap:12px;color:#c9ceb9;font-size:12px;font-weight:600;letter-spacing:.15em;text-transform:uppercase}.mark{color:#e3c690;font-size:25px;letter-spacing:-8px;padding-right:8px}.game{margin-left:auto;letter-spacing:.06em;color:#8b978a}section{margin:35px 0 24px;border:1px solid #3c4839;border-radius:18px;background:#1c241ddb;padding:32px;min-height:210px;box-shadow:0 18px 70px #0003}.eyebrow{color:#b7c6a0;font-size:11px;letter-spacing:.18em;display:flex;align-items:center;gap:8px}.dot{width:6px;height:6px;background:#b7c6a0;border-radius:50%}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(28px,5vw,40px);line-height:1.25;margin:28px 0 4px;overflow-wrap:anywhere}body[data-status=waiting] h1,body[data-status=paused] h1{color:#a8b1a4}body[data-status=thinking] .dot{animation:pulse 1s infinite}footer{display:flex;justify-content:space-between;align-items:center;color:#84917f;font-size:12px}button{border:1px solid #47513f;background:transparent;color:#d0d8c4;border-radius:8px;padding:9px 15px;font:inherit;cursor:pointer}button:hover{background:#303b2c}button:focus-visible{outline:2px solid #e3c690;outline-offset:3px}#retry{margin-right:8px}@keyframes pulse{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media(max-width:420px){.game{display:none}section{padding:25px}main{padding:25px 18px}}
</style></head><body data-status="waiting"><main><header><span class="mark" aria-hidden="true">♠♠</span>Showing Your Hand<span class="game">Slay the Spire 2</span></header><section><div class="eyebrow"><span class="dot"></span>NEXT ACTION</div><h1 id="action" aria-live="polite">Waiting for the game</h1></section><footer><span>Powered by Jev</span><div><button id="retry" hidden>Retry</button><button id="pause">Pause</button></div></footer></main>
<script>
const token='__TOKEN__';let paused=false;
async function command(name){await fetch('/api/'+name,{method:'POST',headers:{'X-CSRF-Token':token}});await poll()}
document.querySelector('#pause').onclick=()=>command(paused?'resume':'pause');
document.querySelector('#retry').onclick=()=>command('retry');
async function poll(){try{const r=await fetch('/api/status',{signal:AbortSignal.timeout(3500)});if(!r.ok)throw Error();const s=await r.json();paused=s.paused;document.body.dataset.status=s.status;const text=s.action||s.message;const el=document.querySelector('#action');if(el.textContent!==text)el.textContent=text;document.querySelector('#pause').textContent=paused?'Resume':'Pause';document.querySelector('#retry').hidden=s.status!=='error'}catch{document.querySelector('#action').textContent='Connection lost';document.body.dataset.status='waiting'}}
async function loop(){await poll();setTimeout(loop,500)}loop();
</script></body></html>
